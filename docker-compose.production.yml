name: navrya

services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pattern-ai:
        condition: service_healthy
      community-api:
        condition: service_healthy

  pattern-ai:
    build:
      context: .
      target: app
    command: ['node', 'server/pattern-ai-server.mjs']
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PATTERN_AI_PORT: 8787
      COMMUNITY_API_URL: http://community-api:8788
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_MODEL: ${KIMI_MODEL:-moonshot-v1-8k}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  community-api:
    build:
      context: .
      target: app
    command: ['node', 'server/community-api-server.mjs']
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      COMMUNITY_API_PORT: 8788
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      UPLOADS_DIR: /app/uploads
      PATTERN_AI_URL: http://pattern-ai:8787
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      ADMIN_AUTH_ENFORCED: 'true'
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8788/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: .
      target: app
    command: ['node', 'server/db/migrate.mjs']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads_data:
