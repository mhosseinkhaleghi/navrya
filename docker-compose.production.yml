name: navrya

services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-app.navrya.com}
      ADMIN_HOST: ${ADMIN_HOST:-admin.navrya.com}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pattern-ai:
        condition: service_healthy
      community-api:
        condition: service_healthy

  pattern-ai:
    build:
      context: .
      target: app
    command: ['node', 'server/pattern-ai-server.mjs']
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PATTERN_AI_PORT: 8787
      COMMUNITY_API_URL: http://community-api:8788
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      REDIS_URL: redis://redis:6379
      AI_QUOTA_PER_USER_PER_HOUR: ${AI_QUOTA_PER_USER_PER_HOUR:-200}
      AI_QUOTA_GLOBAL_PER_HOUR: ${AI_QUOTA_GLOBAL_PER_HOUR:-20000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_MODEL: ${KIMI_MODEL:-moonshot-v1-8k}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  community-api:
    build:
      context: .
      target: app
    command: ['node', 'server/community-api-server.mjs']
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      COMMUNITY_API_PORT: 8788
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
      PATTERN_AI_URL: http://pattern-ai:8787
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ADMIN_AUTH_ENFORCED: 'true'
      # No ADMIN_BOOTSTRAP_EMAIL - that auto-promotion path was removed entirely (see
      # docs/auth/ADR-0001-authentication-architecture.md section 3). Provision the first admin
      # out of band: node scripts/admin-grant.mjs --email=... --confirm=...
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      LEGACY_AUTH_SUNSET_AT: ${LEGACY_AUTH_SUNSET_AT:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      CSP_ENFORCE: ${CSP_ENFORCE:-false}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8788/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: app
    command: ['node', 'server/db/migrate.mjs']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads_data:
  redis_data:
