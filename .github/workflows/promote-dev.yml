name: Verify dev and promote main

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: navrya-dev-promotion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  promote:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Fast-forward main from verified dev
        run: |
          git fetch --prune origin main dev
          if ! git merge-base --is-ancestor origin/main origin/dev; then
            echo "main contains work absent from dev. Reconcile it into dev before promotion."
            exit 1
          fi
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse origin/dev)" ]; then
            git push origin origin/dev:refs/heads/main
          fi

  deploy:
    needs: promote
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    secrets: inherit
