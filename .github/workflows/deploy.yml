name: Test and deploy Navrya

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: navrya-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Deploys the EXACT commit `verify` just tested - never `origin/main`, which could have
      # moved if a second push landed between `verify` finishing and this step running. This is
      # the fix for the tested-commit/deployed-commit race: `github.sha` is fixed for this whole
      # workflow run, so the remote checkout below can never silently deploy a different, untested
      # commit than the one that just passed CI.
      - name: Deploy the tested commit on the server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE_SCRIPT'
            # Bash parses a complete function definition before executing it. Running that
            # function with stdin closed prevents any nested Docker command from consuming the
            # remaining SSH heredoc and silently truncating the release.
            deploy_release() {
            set -eu
            cd /opt/navrya

            # Record what was running before this deploy, so scripts/rollback.sh has a real
            # target - never inferred after the fact from git log, which could be ambiguous if
            # this same commit was deployed more than once.
            if [ -f .last-deployed-sha ]; then
              cp .last-deployed-sha .previous-deployed-sha
            fi

            git fetch --prune origin
            # Verify the commit the workflow tested is actually reachable before touching
            # anything running - fails loudly instead of silently deploying nothing/wrong.
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git checkout --detach "${DEPLOY_SHA}"

            # Preflight: refuse to proceed if required production secrets are missing from the
            # server's own .env - fails BEFORE touching the running containers, not after.
            set -a; . ./.env; set +a
            : "${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET missing in server .env}"
            : "${CSRF_SECRET:?CSRF_SECRET missing in server .env}"
            : "${INTERNAL_API_SECRET:?INTERNAL_API_SECRET missing in server .env}"
            : "${ALLOWED_ORIGINS:?ALLOWED_ORIGINS missing in server .env}"

            # Application services can use Docker's normal content-addressed cache, but the web
            # image is rebuilt cold. A previous successful release left Caddy serving an older
            # checked-in character bundle even though the repository checkout had advanced.
            docker compose --env-file .env -f docker-compose.production.yml build pattern-ai community-api migrate
            docker compose --env-file .env -f docker-compose.production.yml build --no-cache web
            # The remote script itself arrives on stdin via the SSH heredoc. Detach the migration
            # container from that stream so it cannot consume every release command that follows.
            docker compose --env-file .env -f docker-compose.production.yml run --rm -T migrate </dev/null
            docker compose --env-file .env -f docker-compose.production.yml up -d --remove-orphans
            docker compose --env-file .env -f docker-compose.production.yml up -d --no-deps --force-recreate web

            # Post-deploy smoke check against the real running containers - a broken deploy is
            # caught here, before this script records it as "the last known-good deploy".
            sleep 5
            docker compose --env-file .env -f docker-compose.production.yml exec -T community-api wget -qO- http://127.0.0.1:8788/readyz
            docker compose --env-file .env -f docker-compose.production.yml exec -T pattern-ai wget -qO- http://127.0.0.1:8787/health

            # Prove that Caddy is running the image built in this release, rather than merely
            # returning HTTP 200 from a stale container. The character bundle is a stable static
            # asset present in every production image, so matching hashes is release-agnostic.
            web_image_id="$(docker compose --env-file .env -f docker-compose.production.yml images -q web)"
            built_web_hash="$(docker run --rm --entrypoint sha256sum "$web_image_id" /srv/pages/shared/navrya-hunter-sessions-app.js | awk '{print $1}')"
            running_web_hash="$(docker compose --env-file .env -f docker-compose.production.yml exec -T web sha256sum /srv/pages/shared/navrya-hunter-sessions-app.js | awk '{print $1}')"
            test -n "$built_web_hash"
            test "$running_web_hash" = "$built_web_hash"

            echo "${DEPLOY_SHA}" > .last-deployed-sha

            # Prune only images older than 24h - keeps yesterday's (and this deploy's previous)
            # image available for a fast rollback instead of deleting it the moment this
            # deploy succeeds. See scripts/rollback.sh for the one-command rollback path.
            docker image prune -f --filter "until=24h"
            }
            deploy_release </dev/null
          REMOTE_SCRIPT
