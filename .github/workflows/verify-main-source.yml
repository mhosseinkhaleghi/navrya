name: Verify main source

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  require-dev-ancestor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main to come from dev
        run: |
          git fetch --prune origin dev
          if ! git merge-base --is-ancestor HEAD origin/dev; then
            echo "main must only contain a revision from dev."
            exit 1
          fi
