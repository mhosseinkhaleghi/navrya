<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d17" />
    <title>TradeJournal · Admin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.2 19 6v5.55c0 4.18-2.9 7.45-7 9.25-4.1-1.8-7-5.07-7-9.25V6Z"/><path d="m9.1 12 1.8 1.8 4-4.2"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 12h16.4M12 3.5c2.25 2.35 3.4 5.18 3.4 8.5s-1.15 6.15-3.4 8.5c-2.25-2.35-3.4-5.18-3.4-8.5S9.75 5.85 12 3.5"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    </svg>

    <header class="admin-header">
      <div class="brand"><svg><use href="#i-shield" /></svg><strong data-i18n="brand">Admin</strong></div>
      <div class="language-picker">
        <button id="languageButton" type="button" aria-expanded="false"><svg><use href="#i-globe" /></svg><span id="currentLanguage">English</span><svg class="chevron"><use href="#i-chevron" /></svg></button>
        <div class="language-menu" id="languageMenu" hidden>
          <button type="button" data-language="fa">فارسی</button>
          <button type="button" data-language="ar">العربية</button>
          <button type="button" data-language="en">English</button>
          <button type="button" data-language="es">Español</button>
        </div>
      </div>
    </header>

    <div class="admin-gate" id="adminGate" hidden>
      <div class="admin-gate-card">
        <p class="admin-badge test" id="testModeBadge" hidden data-i18n="testModeBanner">TEST MODE — admin auth is disabled</p>
        <p class="admin-badge enforced" id="enforcedBadge" hidden data-i18n="enforcedBanner">Admin authentication is enforced. A real admin session is required.</p>
        <button type="button" class="btn btn-primary" id="continueTestMode" data-i18n="continueTestMode" hidden>Continue in test mode</button>
      </div>
    </div>

    <main class="admin-shell" id="adminShell" hidden>
      <nav class="admin-tabs" id="adminTabs">
        <button type="button" data-tab="users" data-i18n="tabUsers">Users</button>
        <button type="button" data-tab="ai" data-i18n="tabAI">AI</button>
        <button type="button" data-tab="technical" data-i18n="tabTechnical">Technical</button>
        <button type="button" data-tab="xp" data-i18n="tabXP">XP &amp; Segmentation</button>
        <button type="button" data-tab="marketplace" data-i18n="tabMarketplace">Marketplace</button>
        <button type="button" data-tab="financial" data-i18n="tabFinancial">Financial</button>
      </nav>
      <div class="admin-body" id="adminBody"></div>
    </main>

    <div class="toast" id="toast" role="status"></div>
    <script src="../shared/dev-user-switcher.js"></script>
    <script src="app.js"></script>
  </body>
</html>
