<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d17" />
    <title>TradeJournal · Admin</title>
    <link rel="stylesheet" href="../shared/icon-system.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="admin-gate" id="adminGate" hidden>
      <div class="admin-gate-card">
        <div class="admin-gate-brand"><i data-lucide="shield-check"></i><strong data-i18n="brand">Admin</strong></div>
        <p class="admin-badge test" id="testModeBadge" hidden data-i18n="testModeBanner">TEST MODE — admin auth is disabled</p>
        <p class="admin-badge enforced" id="enforcedBadge" hidden data-i18n="enforcedBanner">Admin authentication is enforced. A real admin session is required.</p>
        <button type="button" class="btn btn-primary" id="continueTestMode" data-i18n="continueTestMode" hidden>Continue in test mode</button>
      </div>
    </div>

    <div class="admin-layout" id="adminLayout" hidden>
      <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-brand"><i data-lucide="shield-check"></i><strong data-i18n="brand">Admin</strong></div>
        <nav class="admin-nav" id="adminTabs">
          <button type="button" data-tab="users"><i data-lucide="users"></i><span data-i18n="tabUsers">Users</span></button>
          <button type="button" data-tab="ai"><i data-lucide="brain-circuit"></i><span data-i18n="tabAI">AI</span></button>
          <button type="button" data-tab="technical"><i data-lucide="server-cog"></i><span data-i18n="tabTechnical">Technical</span></button>
          <button type="button" data-tab="xp"><i data-lucide="award"></i><span data-i18n="tabXP">XP &amp; Segmentation</span></button>
          <button type="button" data-tab="marketplace"><i data-lucide="store"></i><span data-i18n="tabMarketplace">Marketplace</span></button>
          <button type="button" data-tab="financial"><i data-lucide="banknote"></i><span data-i18n="tabFinancial">Financial</span></button>
        </nav>
        <a class="admin-back-link" href="#/dashboard/hunter" target="_top"><i data-lucide="arrow-left"></i><span data-i18n="backToApp">Back to app</span></a>
      </aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <button type="button" class="admin-icon-btn admin-sidebar-toggle" id="sidebarToggle" aria-label="Menu"><i data-lucide="menu"></i></button>
          <h1 class="admin-page-title" id="pageTitle"></h1>
          <div class="admin-topbar-actions">
            <span class="admin-current-user" id="currentUserLabel" hidden><i data-lucide="user-round"></i><span id="currentUserName"></span></span>
            <div class="language-picker">
              <button id="languageButton" type="button" aria-expanded="false"><i data-lucide="languages"></i><span id="currentLanguage">English</span><i data-lucide="chevron-down" class="chevron"></i></button>
              <div class="language-menu" id="languageMenu" hidden>
                <button type="button" data-language="fa">فارسی</button>
                <button type="button" data-language="ar">العربية</button>
                <button type="button" data-language="en">English</button>
                <button type="button" data-language="es">Español</button>
              </div>
            </div>
          </div>
        </header>
        <main class="admin-content" id="adminBody"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="../shared/vendor/lucide.min.js"></script>
    <script src="../shared/icon-system.js"></script>
    <script src="../shared/dev-user-switcher.js"></script>
    <script src="../shared/profile-xp-rules.js"></script>
    <script src="app.js"></script>
  </body>
</html>
